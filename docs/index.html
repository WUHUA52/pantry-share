<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><link rel="icon" href="favicon.svg" /><title>
    Pantry Share | Household groceries</title
  ><link rel="stylesheet" href="style.css" />
  <header>
    <div class="wrap mast">
      <b class="brand">Pantry Share.</b><span class="house" data-household>Maple House</span>
    </div>
  </header>
  <main class="wrap">
    <nav id="nav" aria-label="Household tools"></nav>
    <section class="counter">
      <div class="work">
        <h1 id="page-title">Shopping list</h1>
        <p id="status" role="status"></p>
        <div id="view"></div>
      </div>
      <aside class="receipt">
        <div class="receipt-head">
          <span data-household>Maple House</span>
          <h2>Household ledger</h2>
        </div>
        <div id="stats"></div>
        <button class="receipt-link" onclick="navTo('Receipts')">
          View balances
        </button>
      </aside>
    </section>
    <footer>
      Demo household · Sample prices · Saved on this browser. Use fictional
      amounts.
    </footer>
  </main>
  <dialog id="product-dialog" aria-labelledby="product-heading">
    <div class="mast"><h2 id="product-heading"></h2><button aria-label="Close product details" onclick="document.getElementById('product-dialog').close()" autofocus>×</button></div>
    <div id="product-body"></div>
  </dialog>
  <dialog id="modal" aria-labelledby="title">
    <form id="form">
      <div class="mast">
        <h2 id="title"></h2>
        <button type="button" aria-label="Close" onclick="modal.close()">
          ×
        </button>
      </div>
      <div id="fields"></div>
      <p id="error" role="alert"></p>
      <button class="primary">Save</button>
    </form>
  </dialog>
  <script src="money.js"></script>
  <script src="retail.js"></script>
  <script src="product-labels.js"></script>
  <script src="recommendations.js"></script>
  <script src="storage.js"></script>
  <script src="store-data.js"></script>
  <script src="location.js"></script>
  <script src="market.js"></script>
  <script src="household.js"></script>
  <script src="ledger.js"></script>
  <script src="transfer.js"></script>
  <script src="pantry.js"></script>
  <script src="app.js"></script>
</html>
